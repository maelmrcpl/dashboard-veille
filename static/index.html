<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Veille</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=3">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <canvas id="contours" aria-hidden="true"></canvas>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c5.2 0 9.5 3.6 9.5 9s-4 10-9.8 10S2.5 17.2 2.5 12 6.8 2.5 12 2.5z"/><path d="M12.3 6.5c3.2 0 5.7 2.1 5.7 5.3s-2.6 5.7-5.9 5.7-5.6-2.3-5.6-5.4 2.6-5.6 5.8-5.6z"/><path d="M12.4 10.3c1.2 0 2.1.8 2.1 1.9s-1 2-2.3 2-2.1-.9-2.1-2 1-1.9 2.3-1.9z"/></svg>
        Veille
      </a>
      <nav id="nav" aria-label="Catégories"></nav>
      <button class="search-open" id="search-open" type="button" aria-haspopup="dialog" aria-label="Rechercher dans les archives">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Rechercher</span>
        <kbd>/</kbd>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <footer>
    <div class="footer-inner">
      <span><strong>Veille</strong> Dashboard de veille personnel · © <span id="year"></span></span>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>
  <dialog class="palette" id="palette" aria-label="Rechercher dans les archives">
    <div class="palette-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-results" aria-label="Rechercher" placeholder="Rechercher un sujet, une source…" autocomplete="off" spellcheck="false">
      <kbd>Échap</kbd>
    </div>
    <div class="palette-results" id="palette-results" role="listbox" aria-label="Résultats"></div>
    <div class="palette-foot">
      <span id="palette-status" aria-live="polite"></span>
      <span class="palette-keys"><kbd>↑</kbd><kbd>↓</kbd> parcourir <kbd>↵</kbd> ouvrir</span>
    </div>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
